<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>

  <!-- Subtle Circuit Traces -->
  <path d="M80 140 H180 L220 180 V280" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M432 140 H332 L292 180 V280" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M140 400 L200 340 H312 L372 400" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" fill="none"/>

  <circle cx="80" cy="140" r="4" fill="#06B6D4" opacity="0.4"/>
  <circle cx="432" cy="140" r="4" fill="#8B5CF6" opacity="0.4"/>

  <!-- Outer Shield Contour -->
  <path d="M256 64 L394 122 C394 256 336 372 256 432 C176 372 118 256 118 122 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Inner Shard Facets (Reverse Engineering / Deconstruction) -->
  <path d="M256 94 L366 142 C366 244 318 340 256 392 V94 Z" 
        fill="#3B82F6" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M256 94 L146 142 C146 244 194 340 256 392 V94 Z" 
        fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Central Aegis 'A' Prism Core -->
  <path d="M256 150 L320 285 H280 L256 235 L232 285 H192 Z" fill="url(#coreGrad)" filter="url(#neonGlow)"/>
  <polygon points="256,192 270,225 242,225" fill="#0F172A"/>

  <!-- Node Dots at Vertexes -->
  <circle cx="256" cy="64" r="6" fill="#22D3EE"/>
  <circle cx="394" cy="122" r="6" fill="#3B82F6"/>
  <circle cx="118" cy="122" r="6" fill="#8B5CF6"/>
  <circle cx="256" cy="432" r="6" fill="#06B6D4"/>
</svg>
