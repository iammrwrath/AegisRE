name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact qualification source; must match the caller revision.
        required: true
        type: string
      remote_cache_write:
        description: Trusted release qualification may publish the remote cache.
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.source_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && inputs.source_sha == '' }}

jobs:
  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify runtime
        run: npm run build:cached
